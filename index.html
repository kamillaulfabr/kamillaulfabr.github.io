<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Undangan Spesial 🎂</title>
<style>
:root{color-scheme:dark;--bg:#0a1730;--card:#13264f;--text:#e8eefc;--accent:#4f86f7;--accent2:#2c4c93;--head:#a9c4ff}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:radial-gradient(circle at top,#14285a 0%,var(--bg) 60%) fixed;color:var(--text);text-align:center;overflow-x:hidden}
section{max-width:620px;margin:0 auto;padding:40px 20px}
h1{font-size:2.2rem;color:var(--head);margin:.3em 0}
.sub{font-size:1.1rem;opacity:.85}
.card{background:var(--card);border-radius:18px;padding:22px;box-shadow:0 6px 24px rgba(0,0,0,.35);margin:20px 0}
.gallery{position:relative}
.gallery img{width:100%;max-height:70vh;object-fit:contain;border-radius:14px;display:block;background:#0a1730}
.ph{width:100%;aspect-ratio:4/5;border-radius:14px;background:var(--accent2)}
.ph{display:flex;align-items:center;justify-content:center;font-size:4rem}
.nav{display:flex;justify-content:center;gap:10px;margin-top:12px}
.nav button{background:var(--accent);color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:1.1rem;cursor:pointer}
.detail{font-size:1.05rem;line-height:1.9}
.btns{position:relative;height:130px;margin-top:10px}
.btn{font-family:inherit;font-size:1.1rem;border:0;border-radius:30px;padding:14px 28px;cursor:pointer}
#yes{background:var(--accent);color:#fff;font-weight:bold}
#no{background:var(--accent2);color:#fff;position:absolute;left:55%;top:0;transition:all .25s}
#yes{position:absolute;left:10%;top:0}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.heart{position:absolute;bottom:-30px;animation:up linear forwards}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>

<section>
  <div class="sub">Buat Majar yang selalu pengen lian cium muaah</div>
  <h1 id="title"></h1>
  <p class="sub" id="intro"></p>

  <div class="card gallery">
    <div id="photoBox"></div>
    <div class="nav">
      <button onclick="move(-1)" aria-label="Foto sebelumnya">‹</button>
      <button onclick="move(1)" aria-label="Foto berikutnya">›</button>
    </div>
  </div>

  <div class="card"><p id="message" style="line-height:1.8;margin:0"></p></div>

  <div class="card detail" id="details"></div>

  <h2 style="color:var(--head)" id="question"></h2>
  <div class="btns">
    <button class="btn" id="yes" onclick="sayYes()">Mau dong! 💖</button>
    <button class="btn" id="no" onmouseover="dodge()" ontouchstart="dodge()" onclick="dodge()">Mikir dulu…</button>
  </div>
  <p id="thanks" class="sub"></p>
</section>

<div class="hearts" id="hearts"></div>

<script>
/* Foto diambil dari folder assets. */
const IMG = [
  "assets/image1.jpeg",
  "assets/image2.jpeg",
  "assets/image3.jpeg",
  "assets/image4.jpeg",
  "assets/image5.jpeg",
  "assets/image6.jpeg",
];
</script>
<script>
/* ============ EDIT BAGIAN INI SAJA ============ */
const CONFIG = {
  title: "Ada yang mau nambah umur niii",
  intro: "Happy birthday, buy <3",
  message: "Makasi ya buy udah hadir di hidup aku! im so happy for having u in my life, i hope i can be one of the reason u still alive, always remember if i loves u💕💕",
  question: "Jadiii?",
  details: [
    ["📅 Tanggal", "Selasa, 10 Oktober 2026"],
    ["🕖 Waktu", "19.00 WIB - Selesai"],
    ["📍 Tempat", "Percayakan pada aku hoho"],
    ["👗 Dress code", "Baju: Navy<br>Celana: Abu muda"],
  ],
  // Nomor WhatsApp tujuan (085748626490 dalam format internasional)
  whatsapp: "6285748626490",
  waText: "Mau dong! Aku mau 💖",
  // Foto dari folder assets.
  photos: IMG.map(src => ({ src })),
};
/* ============================================== */

const $ = id => document.getElementById(id);
$("title").textContent = CONFIG.title;
$("intro").textContent = CONFIG.intro;
$("message").textContent = CONFIG.message;
$("question").textContent = CONFIG.question;
$("details").innerHTML = CONFIG.details.map(d => `<div><b>${d[0]}</b><br>${d[1]}</div>`).join("");

let idx = 0;
function show(){
  const p = CONFIG.photos[idx];
  const box = $("photoBox");
  if(!p){ box.innerHTML = '<div class="ph">💑</div>'; return; }
  const img = new Image();
  img.alt = "Foto kami";
  img.onerror = () => { box.innerHTML = '<div class="ph">💑</div>'; };
  img.onload = () => { box.innerHTML = ""; box.appendChild(img); };
  img.src = p.src;
}
function move(n){ if(!CONFIG.photos.length) return; idx = (idx + n + CONFIG.photos.length) % CONFIG.photos.length; show(); }
show();
setInterval(() => move(1), 5000);

function dodge(){
  const b = $("no"), area = document.querySelector(".btns");
  const maxX = area.clientWidth - b.offsetWidth, maxY = area.clientHeight - b.offsetHeight;
  b.style.left = Math.random() * maxX + "px";
  b.style.top = Math.random() * maxY + "px";
}

function rain(){
  const wrap = $("hearts");
  for(let i = 0; i < 40; i++){
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = ["💖","💕","🎉","🎂","✨"][i % 5];
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = 18 + Math.random() * 22 + "px";
    h.style.animationDuration = 3 + Math.random() * 3 + "s";
    h.style.animationDelay = Math.random() * 1.5 + "s";
    wrap.appendChild(h);
    setTimeout(() => h.remove(), 8000);
  }
}

function sayYes(){
  rain();
  $("thanks").textContent = "Yeay! Terima kasih sudah mau. Sampai ketemu ya 💕";
  if(CONFIG.whatsapp){
    setTimeout(() => {
      window.open("https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(CONFIG.waText), "_blank");
    }, 1500);
  }
}
</script>
</body>
</html>
