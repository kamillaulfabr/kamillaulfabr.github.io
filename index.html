<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Undangan Spesial 🎂</title>
<style>
:root{color-scheme:dark;--bg:#0a1730;--card:#13264f;--text:#e8eefc;--accent:#4f86f7;--accent2:#2c4c93;--head:#a9c4ff}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:radial-gradient(circle at top,#14285a 0%,var(--bg) 60%) fixed;color:var(--text);text-align:center;overflow-x:hidden}
section{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:40px 20px}
h1{font-size:2.2rem;color:var(--head);margin:.3em 0}
.sub{font-size:1.1rem;opacity:.85}
.card{background:var(--card);border-radius:18px;padding:22px;box-shadow:0 6px 24px rgba(0,0,0,.35);margin:20px 0}
.gallery{position:relative}
.gallery img{width:100%;max-height:70vh;object-fit:contain;border-radius:14px;display:block;background:#0a1730}
.ph{width:100%;aspect-ratio:4/5;border-radius:14px;background:var(--accent2)}
.ph{display:flex;align-items:center;justify-content:center;font-size:4rem}
.nav{display:flex;justify-content:center;gap:10px;margin-top:12px}
.nav button{background:var(--accent);color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:1.1rem;cursor:pointer}
.detail{font-size:1.05rem;line-height:1.9}
.btns{position:relative;height:130px;margin-top:10px}
.btn{font-family:inherit;font-size:1.1rem;border:0;border-radius:30px;padding:14px 28px;cursor:pointer}
#yes{background:var(--accent);color:#fff;font-weight:bold}
#no{background:var(--accent2);color:#fff;position:absolute;left:55%;top:0;transition:all .25s}
#yes{position:absolute;left:10%;top:0}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.heart{position:absolute;bottom:-30px;animation:up linear forwards}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}

/* Latar belakang stiker */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;transition:opacity .8s}
.bg img{position:absolute;opacity:.45;transition:opacity .6s;transform:rotate(var(--r));animation:float ease-in-out infinite alternate;user-select:none}
body.on-cover .bg{opacity:0}
@keyframes float{
  from{transform:rotate(var(--r)) translateY(0)}
  to{transform:rotate(calc(var(--r) + 8deg)) translateY(-16px)}
}
@media (prefers-reduced-motion:reduce){.bg img{animation:none}}

/* Halaman pembuka */
.cover{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .6s}
.cover.out{opacity:0;pointer-events:none}
.cover .box{background:rgba(19,38,79,.88);border-radius:24px;padding:36px 26px;max-width:520px;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:pop .8s ease-out both}
.cover .big{font-size:2rem;line-height:1.35;margin:.2em 0 .8em}
.cover .env{font-size:4rem;display:inline-block;animation:bounce 1.6s ease-in-out infinite}
.cover .open{background:var(--accent);color:#fff;font-weight:bold}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:none}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){.cover .env,.cover .box{animation:none}}
</style>
</head>
<body class="on-cover">

<div class="bg" id="bg" aria-hidden="true"></div>

<!-- HALAMAN 1: pembuka -->
<div class="cover" id="cover">
  <div class="box">
    <div class="env">💌</div>
    <h1 class="big">HIII! I have something for you hihi (ily)</h1>
    <button class="btn open" onclick="openGift()">Buka dulu yuk 🎁</button>
  </div>
</div>

<!-- HALAMAN 2: undangan -->
<section id="main" hidden>
  <div class="sub">Buat Majar yang selalu pengen lian cium muaah</div>
  <h1 id="title"></h1>
  <p class="sub" id="intro"></p>

  <div class="card gallery">
    <div id="photoBox"></div>
    <div class="nav">
      <button onclick="move(-1)" aria-label="Foto sebelumnya">‹</button>
      <button onclick="move(1)" aria-label="Foto berikutnya">›</button>
    </div>
  </div>

  <div class="card"><p id="message" style="line-height:1.8;margin:0"></p></div>

  <div class="card detail" id="details"></div>

  <h2 style="color:var(--head)" id="question"></h2>
  <div class="btns">
    <button class="btn" id="yes" onclick="sayYes()">Mau dong! 💖</button>
    <button class="btn" id="no" onmouseover="dodge()" ontouchstart="dodge()" onclick="dodge()">Mikir dulu…</button>
  </div>
  <p id="thanks" class="sub"></p>
</section>

<div class="hearts" id="hearts"></div>

const $ = id => document.getElementById(id);

/* ===== Latar belakang stiker ===== */
(function makeBackground(){
  const bg = $("bg");
  const COLS = 4, ROWS = 6;            // jumlah stiker = COLS x ROWS (ubah untuk lebih banyak/sedikit)
  for(let r = 0; r < ROWS; r++){
    for(let c = 0; c < COLS; c++){
      const im = new Image();
      im.src = STICKER;
      im.alt = "";
      const size = 55 + Math.random() * 55;                    // lebar 55–110 px
      im.style.width = size + "px";
      im.style.left = ((c + Math.random() * 0.7) / COLS * 100) + "%";
      im.style.top = ((r + Math.random() * 0.7) / ROWS * 100) + "%";
      im.style.setProperty("--r", (Math.random() * 50 - 25) + "deg");
      im.style.animationDuration = (3 + Math.random() * 4) + "s";
      im.style.animationDelay = (-Math.random() * 6) + "s";
      bg.appendChild(im);
    }
  }
})();

/* ===== Pindah dari halaman pembuka ke undangan ===== */
function openGift(){
  const cover = $("cover");
  cover.classList.add("out");
  document.body.classList.remove("on-cover");
  $("main").hidden = false;
  window.scrollTo(0, 0);
  rain();
  setTimeout(() => { cover.style.display = "none"; }, 600);
}

let idx = 0;
function show(){
  const p = CONFIG.photos[idx];
  const box = $("photoBox");
  if(!p){ box.innerHTML = '<div class="ph">💑</div>'; return; }
  const img = new Image();
  img.alt = "Foto kami";
  img.onerror = () => { box.innerHTML = '<div class="ph">💑</div>'; };
  img.onload = () => { box.innerHTML = ""; box.appendChild(img); };
  img.src = p.src;
}
function move(n){ if(!CONFIG.photos.length) return; idx = (idx + n + CONFIG.photos.length) % CONFIG.photos.length; show(); }
show();
setInterval(() => move(1), 5000);

function dodge(){
  const b = $("no"), area = document.querySelector(".btns");
  const maxX = area.clientWidth - b.offsetWidth, maxY = area.clientHeight - b.offsetHeight;
  b.style.left = Math.random() * maxX + "px";
  b.style.top = Math.random() * maxY + "px";
}

function rain(){
  const wrap = $("hearts");
  for(let i = 0; i < 40; i++){
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = ["💖","💕","🎉","🎂","✨"][i % 5];
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = 18 + Math.random() * 22 + "px";
    h.style.animationDuration = 3 + Math.random() * 3 + "s";
    h.style.animationDelay = Math.random() * 1.5 + "s";
    wrap.appendChild(h);
    setTimeout(() => h.remove(), 8000);
  }
}
